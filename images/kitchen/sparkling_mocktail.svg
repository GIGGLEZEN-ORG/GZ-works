<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="50%" stop-color="#1e232d"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="140" fill="url(#glow)"/>
  <circle cx="300" cy="160" r="65" fill="#14171d" stroke="url(#gold)" stroke-width="2"/>
  <text x="300" y="175" font-size="54" text-anchor="middle" dominant-baseline="central">🍹</text>
  <rect x="50" y="270" width="500" height="2" fill="url(#gold)" opacity="0.6"/>
  <text x="300" y="310" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#f8f5ee" text-anchor="middle">Sparkling Mocktail</text>
  <text x="300" y="345" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#d4af37" letter-spacing="2" text-anchor="middle">BEVERAGES</text>
