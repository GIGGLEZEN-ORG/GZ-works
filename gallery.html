  <style>
    :root {
      --ink: #1f1b18;
      --muted: #66594d;
      --gold: #7d5307;
      --paper: #fff8f5;
      --line: #d4c4b3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Manrope, sans-serif; }
    .page { width: min(1180px, calc(100% - 3rem)); margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 2rem 0 3rem; }
    .eyebrow { color: var(--gold); font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: .35rem 0 0; font-family: "EB Garamond", serif; font-size: clamp(2.5rem, 6vw, 4.8rem); font-weight: 500; line-height: .95; }
    .back { color: var(--gold); border: 1px solid var(--line); border-radius: .5rem; padding: .7rem 1rem; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; white-space: nowrap; }
    .back:hover { background: #f5ede4; }
    .gallery { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem; padding-bottom: 4rem; }
    figure { position: relative; min-height: 18rem; margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: .75rem; background: #f0e6e1; }
    figure:nth-child(1), figure:nth-child(2) { grid-column: span 6; min-height: 25rem; }
    figure:nth-child(n+3) { grid-column: span 4; }
    figure img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
    figure:hover img { transform: scale(1.04); }
    figcaption { position: absolute; right: 0; bottom: 0; left: 0; padding: 3rem 1.25rem 1.1rem; color: white; background: linear-gradient(transparent, rgba(26,20,16,.85)); font-family: "EB Garamond", serif; font-size: 1.4rem; }
    @media (max-width: 700px) {
      .page { width: min(100% - 2rem, 34rem); }
      .header { align-items: flex-start; padding: 1.5rem 0 2rem; }
      .header h1 { font-size: 3rem; }
      .back { margin-top: .25rem; }
      figure:nth-child(n) { grid-column: span 12; min-height: 19rem; }
    }
  </style>
